          cat > app/src/main/java/com/lcs/deltaesp/GlowDetector.kt <<'EOF'
          package com.lcs.deltaesp

          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          data class Box(val x: Int, val y: Int, val w: Int, val h: Int, val conf: Int = 1) {
              val cx: Int get() = x + w / 2
              val cy: Int get() = y + h / 2
          }

          class GlowDetector {

              private class Cell(var x: Int, var y: Int, var w: Int, var h: Int, var pix: Int)
              private class Track(
                  var x: Int, var y: Int, var w: Int, var h: Int, var conf: Int, var miss: Int
              )

              var redMin = 172
              var greenMax = 77
              var blueMax = 79
              var dominance = 71
              var minPixels = 28
              var minHeight = 12
              var minAspect = 1.05f
              var maxAspect = 7.0f
              var maxWidthRatio = 0.55f
              var maxHeightRatio = 0.96f
              var hudCropTop = 0.055f
              var hudCropBottom = 0.945f
              var maxTargets = 10
              var forceOrder = -1

              private var orderResolved = -1
              private var w = 0
              private var h = 0
              private var mask = IntArray(0)
              private var shadow = IntArray(0)
              private val live = ArrayList<Track>()
              private val out = ArrayList<Box>()

              fun orderLabel(): String = if (orderResolved == 1) "BGRA" else "RGBA"

              fun configure(sensitivity: Int) {
                  val s = sensitivity.coerceIn(0, 100)
                  redMin = 205 - (s * 60) / 100
                  greenMax = 50 + (s * 50) / 100
                  blueMax = 55 + (s * 45) / 100
                  dominance = 90 - (s * 35) / 100
                  minPixels = 44 - (s * 28) / 100
              }

              fun reset() {
                  live.clear()
              }

              fun feed(
                  buf: ByteArray, srcW: Int, srcH: Int, rowStride: Int, pixelStride: Int
              ): List<Box> {
                  if (srcW < 24 || srcH < 24) return emptyList()
                  ensure(srcW, srcH)
                  if (orderResolved < 0) resolveOrder(buf, srcW, srcH, rowStride, pixelStride)
                  val rOff = if (orderResolved == 1) 2 else 0
                  val bOff = if (orderResolved == 1) 0 else 2

                  var i = 0
                  for (y in 0 until h) {
                      val base = y * rowStride
                      for (x in 0 until w) {
                          val p = base + x * pixelStride
                          var on = 0
                          if (p + 2 < buf.size) {
                              val r = buf[p + rOff].toInt() and 0xFF
                              val g = buf[p + 1].toInt() and 0xFF
                              val b = buf[p + bOff].toInt() and 0xFF
                              if (r >= redMin && g <= greenMax && b <= blueMax &&
                                  r - max(g, b) >= dominance
                              ) on = 1
                          }
                          mask[i++] = on
                      }
                  }

                  bridge()
                  val raw = cluster()
                  val merged = merge(raw)
                  val filtered = filter(merged)
                  return track(filtered)
              }

              private fun ensure(nw: Int, nh: Int) {
                  if (nw != w || nh != h) {
                      w = nw
                      h = nh
                      mask = IntArray(w * h)
                      shadow = IntArray(w * h)
                      live.clear()
                      orderResolved = -1
                  }
              }

              private fun resolveOrder(
                  buf: ByteArray, srcW: Int, srcH: Int, rowStride: Int, pixelStride: Int
              ) {
                  if (forceOrder == 0 || forceOrder == 1) {
                      orderResolved = forceOrder
                      return
                  }
                  var rgba = 0
                  var bgra = 0
                  var y = 0
                  while (y < srcH) {
                      val base = y * rowStride
                      var x = 0
                      while (x < srcW) {
                          val p = base + x * pixelStride
                          if (p + 2 < buf.size) {
                              val c0 = buf[p].toInt() and 0xFF
                              val g = buf[p + 1].toInt() and 0xFF
                              val c2 = buf[p + 2].toInt() and 0xFF
                              if (isRed(c0, g, c2)) rgba++
                              if (isRed(c2, g, c0)) bgra++
                          }
                          x += 3
                      }
                      y += 3
                  }
                  orderResolved = if (bgra > rgba * 2 && bgra > 8) 1 else 0
              }

              private fun isRed(r: Int, g: Int, b: Int): Boolean =
                  r >= redMin && g <= greenMax && b <= blueMax && r - max(g, b) >= dominance

              private fun bridge() {
                  System.arraycopy(mask, 0, shadow, 0, mask.size)
                  for (y in 1 until h - 1) {
                      val base = y * w
                      val up = base - w
                      val dn = base + w
                      for (x in 0 until w) {
                          if (shadow[base + x] == 0 && shadow[up + x] == 1 && shadow[dn + x] == 1) {
                              mask[base + x] = 1
                          }
                      }
                  }
              }

              private fun cluster(): ArrayList<Cell> {
                  val open = ArrayList<Cell>()
                  val done = ArrayList<Cell>()
                  for (y in 0 until h) {
                      val base = y * w
                      var x = 0
                      while (x < w) {
                          if (mask[base + x] == 0) {
                              x++
                              continue
                          }
                          val start = x
                          while (x < w && mask[base + x] == 1) x++
                          val runW = x - start
                          if (runW < 2) continue
                          val cx = start + runW / 2
                          var hit: Cell? = null
                          var best = Int.MAX_VALUE
                          for (c in open) {
                              if (c.y + c.h < y - 3) continue
                              val d = abs(c.x + c.w / 2 - cx)
                              val lim = max(6, min(c.w, runW))
                              if (d <= lim && d < best) {
                                  best = d
                                  hit = c
                              }
                          }
                          if (hit == null) {
                              open.add(Cell(start, y, runW, 1, runW))
                          } else {
                              val nx = min(hit.x, start)
                              val nr = max(hit.x + hit.w, x)
                              hit.x = nx
                              hit.w = nr - nx
                              hit.h = y - hit.y + 1
                              hit.pix += runW
                          }
                      }
                      var k = 0
                      while (k < open.size) {
                          val c = open[k]
                          if (c.y + c.h < y - 2) {
                              done.add(c)
                              open.removeAt(k)
                          } else {
                              k++
                          }
                      }
                  }
                  done.addAll(open)
                  return done
              }

              private fun merge(input: ArrayList<Cell>): ArrayList<Cell> {
                  var changed = true
                  while (changed) {
                      changed = false
                      var i = 0
                      outer@ while (i < input.size) {
                          var j = i + 1
                          while (j < input.size) {
                              val a = input[i]
                              val b = input[j]
                              val ox = min(a.x + a.w, b.x + b.w) - max(a.x, b.x)
                              if (ox <= 0) {
                                  j++
                                  continue
                              }
                              val oxr = ox.toFloat() / min(a.w, b.w).toFloat()
                              val gap = max(a.y, b.y) - min(a.y + a.h, b.y + b.h)
                              if (oxr >= 0.45f && gap <= max(4, min(a.h, b.h) / 3)) {
                                  val nx = min(a.x, b.x)
                                  val ny = min(a.y, b.y)
                                  a.w = max(a.x + a.w, b.x + b.w) - nx
                                  a.h = max(a.y + a.h, b.y + b.h) - ny
                                  a.x = nx
                                  a.y = ny
                                  a.pix += b.pix
                                  input.removeAt(j)
                                  changed = true
                                  continue@outer
                              }
                              j++
                          }
                          i++
                      }
                  }
                  return input
              }

              private fun filter(input: ArrayList<Cell>): ArrayList<Box> {
                  out.clear()
                  val top = h * hudCropTop
                  val bottom = h * hudCropBottom
                  for (c in input) {
                      if (c.pix < minPixels) continue
                      if (c.h < minHeight) continue
                      if (c.y + c.h / 2 < top || c.y + c.h / 2 > bottom) continue
                      if (c.w > w * maxWidthRatio) continue
                      if (c.h > h * maxHeightRatio) continue
                      val aspect = c.h.toFloat() / c.w.toFloat()
                      if (aspect < minAspect || aspect > maxAspect) continue
                      out.add(Box(c.x, c.y, c.w, c.h))
                  }
                  return out
              }

              private fun track(input: ArrayList<Box>): List<Box> {
                  val used = BooleanArray(input.size)
                  val result = ArrayList<Box>(input.size)
                  for (t in live) {
                      var bi = -1
                      var bd = Int.MAX_VALUE
                      for (i in input.indices) {
                          if (used[i]) continue
                          val b = input[i]
                          val d = abs(b.cx - (t.x + t.w / 2)) + 2 * abs(b.cy - (t.y + t.h / 2))
                          if (d < bd) {
                              bd = d
                              bi = i
                          }
                      }
                      val gate = max(30, t.w) * 2
                      if (bi >= 0 && bd <= gate) {
                          val b = input[bi]
                          used[bi] = true
                          t.x = (t.x * 0.5f + b.x * 0.5f).toInt()
                          t.y = (t.y * 0.5f + b.y * 0.5f).toInt()
                          t.w = (t.w * 0.5f + b.w * 0.5f).toInt()
                          t.h = (t.h * 0.5f + b.h * 0.5f).toInt()
                          t.conf = min(t.conf + 1, 4)
                          t.miss = 0
                      } else {
                          t.miss++
                      }
                      if (t.conf >= 2 && t.miss <= 1) {
                          result.add(Box(t.x, t.y, t.w, t.h, t.conf))
                      }
                  }
                  for (i in input.indices) {
                      if (used[i]) continue
                      val b = input[i]
                      live.add(Track(b.x, b.y, b.w, b.h, 1, 0))
                  }
                  live.removeAll { it.miss > 1 || it.conf <= 0 }
                  if (live.size > 24) {
                      live.subList(0, live.size - 24).clear()
                  }
                  result.sortByDescending { it.w * it.h }
                  return if (result.size > maxTargets) result.subList(0, maxTargets) else result
              }
          }
          EOF

          cat > app/src/main/java/com/lcs/deltaesp/OverlayView.kt <<'EOF'
          package com.lcs.deltaesp

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View
          import kotlin.math.min

          class OverlayView(ctx: Context) : View(ctx) {

              private val boxes = ArrayList<RectF>()
              private var hud = ""
              private var fillAlpha = 60
              private var lineAlpha = 210
              private var enabled = true

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = dp(1.6f)
              }
              private val corner = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = dp(2.6f)
                  strokeCap = Paint.Cap.ROUND
              }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(235, 0, 255, 170)
                  textSize = dp(10.5f)
                  typeface = android.graphics.Typeface.MONOSPACE
              }
              private val hudPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(200, 0, 255, 170)
                  textSize = dp(9.5f)
                  typeface = android.graphics.Typeface.MONOSPACE
              }

              init {
                  setBackgroundColor(Color.TRANSPARENT)
                  isClickable = false
                  isFocusable = false
              }

              fun configure(fillPercent: Int, drawing: Boolean) {
                  fillAlpha = (fillPercent.coerceIn(10, 100) * 255 / 100) / 3
                  lineAlpha = fillPercent.coerceIn(10, 100) * 255 / 100
                  enabled = drawing
                  invalidate()
              }

              fun submit(list: List<RectF>, hudLine: String) {
                  boxes.clear()
                  boxes.addAll(list)
                  hud = hudLine
                  invalidate()
              }

              fun clearAll() {
                  boxes.clear()
                  hud = ""
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (enabled) {
                      val c = Color.argb(lineAlpha, 0, 255, 170)
                      for (r in boxes) {
                          fill.color = Color.argb(fillAlpha, 0, 255, 170)
                          canvas.drawRect(r, fill)
                          line.color = c
                          canvas.drawRect(r, line)
                          val arm = min(r.width(), r.height()) * 0.3f
                          corner.color = c
                          canvas.drawLine(r.left, r.top, r.left + arm, r.top, corner)
                          canvas.drawLine(r.left, r.top, r.left, r.top + arm, corner)
                          canvas.drawLine(r.right, r.top, r.right - arm, r.top, corner)
                          canvas.drawLine(r.right, r.top, r.right, r.top + arm, corner)
                          canvas.drawLine(r.left, r.bottom, r.left + arm, r.bottom, corner)
                          canvas.drawLine(r.left, r.bottom, r.left, r.bottom - arm, corner)
                          canvas.drawLine(r.right, r.bottom, r.right - arm, r.bottom, corner)
                          canvas.drawLine(r.right, r.bottom, r.right, r.bottom - arm, corner)
                          canvas.drawText(
                              "${r.height().toInt()}px", r.left + dp(3f), r.top - dp(4f), text
                          )
                      }
                  }
                  if (hud.isNotEmpty()) {
                      canvas.drawText(hud, dp(10f), dp(24f), hudPaint)
                  }
              }

              private fun dp(v: Float) = v * resources.displayMetrics.density
          }
          EOF

          cat > app/src/main/java/com/lcs/deltaesp/PanelView.kt <<'EOF'
          package com.lcs.deltaesp

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.appcompat.widget.SwitchCompat

          class PanelView(
              ctx: Context, private val prefs: Prefs, private val cb: Callback
          ) : LinearLayout(ctx) {

              interface Callback {
                  fun onDrawEnabled(enabled: Boolean)
                  fun onSensitivity(v: Int)
                  fun onAlpha(v: Int)
                  fun onFps(v: Int)
                  fun onScale(v: Int)
                  fun onClose()
              }

              val header: LinearLayout
              private val statusView: TextView

              init {
                  orientation = VERTICAL
                  background = GradientDrawable().apply {
                      cornerRadius = dp(14f).toFloat()
                      setColor(Color.argb(216, 14, 18, 24))
                      setStroke(dp(1f), Color.argb(150, 0, 255, 170))
                  }
                  setPadding(dp(12f), dp(8f), dp(12f), dp(12f))
                  minimumWidth = dp(232f)

                  header = LinearLayout(ctx).apply {
                      orientation = HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, dp(4f))
                  }
                  val title = TextView(ctx).apply {
                      text = "LCS · 悬浮绘制"
                      setTextColor(Color.parseColor("#00FFAA"))
                      textSize = 13.5f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val close = TextView(ctx).apply {
                      text = "✕"
                      setTextColor(Color.parseColor("#8FA0AE"))
                      textSize = 16f
                      setPadding(dp(12f), 0, dp(2f), 0)
                      setOnClickListener { cb.onClose() }
                  }
                  header.addView(
                      title,
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  header.addView(close)
                  addView(header)

                  val sw = SwitchCompat(ctx).apply {
                      isChecked = prefs.drawEnabled
