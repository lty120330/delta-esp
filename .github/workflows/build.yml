                      ACTION_START -> {
                          startForegroundCompat()
                          val code = intent.getIntExtra(EXTRA_CODE, 0)
                          @Suppress("DEPRECATION")
                          val data: Intent? = intent.getParcelableExtra(EXTRA_DATA)
                          if (data == null) {
                              stopSelf()
                              return START_NOT_STICKY
