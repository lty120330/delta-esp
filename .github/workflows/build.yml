                  val gen = ++generation
                  projection = mp
                  mp.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          main.post { if (gen == generation) stopAll(true) }
                      }
                  }, main)

                  thread = HandlerThread("lcs-esp-worker").also { it.start() }
                  worker = Handler(thread!!.looper)
                  detector.reset()
                  detector.configure(prefs.sensitivity)
                  panel?.setStatus("等待游戏进入前台…")
                  main.postDelayed({ if (gen == generation) buildDisplay(gen) }, DISPLAY_DELAY_MS)
              }

