                  val i = Intent(
                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                      Uri.parse("package:$packageName")
                  )
                  try {
                      startActivityForResult(i, REQ_OVERLAY)
                  } catch (t: Throwable) {
                      startActivityForResult(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION), REQ_OVERLAY
                      )
                  }
