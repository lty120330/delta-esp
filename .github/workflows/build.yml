                  if (released || projection == null || worker == null) return
                  running = false
                  runCatching { vd?.release() }
                  vd = null
                  runCatching { reader?.close() }
                  reader = null
                  detector.reset()
                  refreshScreenSize()
                  val gen = generation
                  main.postDelayed({ if (gen == generation) buildDisplay(gen) }, 500L)
              }

              private fun buildDisplay(gen: Int) {
                  if (released || gen != generation) return
                  if (vd != null) return
                  val mp = projection ?: return
                  val w = worker ?: return
                  refreshScreenSize()
                  val d = prefs.scale.coerceIn(2, 8)
                  capW = ((screenW / d) / 2) * 2
                  capH = ((screenH / d) / 2) * 2
                  if (capW < 64 || capH < 64) return

                  val r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)
                  reader = r
                  r.setOnImageAvailableListener({ onFrame(it) }, w)
                  vd = try {
                      mp.createVirtualDisplay(
                          "lcs-esp-capture",
                          capW, capH,
                          resources.displayMetrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          r.surface,
                          null,
                          w
                      )
                  } catch (t: Throwable) {
                      null
                  }
                  if (vd == null) {
                      stopAll(true)
                      return
                  }
                  running = true
                  lastFrameAt = 0L
                  fpsMark = SystemClock.elapsedRealtime()
                  frameCount = 0
                  panel?.setStatus("采集中 " + capW + "x" + capH)
              }

              private fun onFrame(r: ImageReader) {
                  if (!running) return
                  val img = try {
                      r.acquireLatestImage()
                  } catch (t: Throwable) {
                      null
                  } ?: return
                  try {
                      val now = SystemClock.elapsedRealtime()
                      val gap = 1000L / prefs.fps.coerceIn(2, 30)
                      if (now - lastFrameAt < gap) return
                      lastFrameAt = now

                      val plane = img.planes[0]
                      val buf = plane.buffer
                      val rowStride = plane.rowStride
                      val pxStride = plane.pixelStride
                      val w = img.width
                      val h = img.height
                      if (w <= 0 || h <= 0 || rowStride <= 0 || pxStride <= 0) return

                      val need = (h - 1) * rowStride + w * pxStride
                      if (frameBuf.size < need) frameBuf = ByteArray(need)
                      buf.rewind()
                      buf.get(frameBuf, 0, min(need, buf.remaining()))

                      val boxes = detector.feed(frameBuf, w, h, rowStride, pxStride)

                      frameCount++
                      if (now - fpsMark >= 1000L) {
                          fps = frameCount * 1000f / (now - fpsMark)
                          frameCount = 0
                          fpsMark = now
                      }

                      val sx = screenW.toFloat() / w.toFloat()
                      val sy = screenH.toFloat() / h.toFloat()
                      val rects = ArrayList<RectF>(boxes.size)
                      for (b in boxes) {
                          rects.add(
                              RectF(b.x * sx, b.y * sy, (b.x + b.w) * sx, (b.y + b.h) * sy)
                          )
                      }
                      val count = boxes.size
                      val fpsText = String.format("%.0f", fps)
                      val hud = "LCS | " + count + " 目标 | " + fpsText + "fps | " + w + "x" + h +
                          " | 灵敏" + prefs.sensitivity + " " + detector.orderLabel()
                      main.post {
                          overlay?.submit(rects, hud)
                          panel?.setStatus("$count 目标 · $fpsText fps · ${w}x$h")
                      }
                  } catch (t: Throwable) {
                  } finally {
                      runCatching { img.close() }
                  }
              }

              private fun stopAll(stopService: Boolean) {
                  if (released) return
                  released = true
                  running = false
                  generation++
                  main.removeCallbacksAndMessages(null)

                  runCatching { vd?.release() }
                  vd = null
                  runCatching { reader?.close() }
                  reader = null
                  runCatching { projection?.stop() }
                  projection = null
                  runCatching { thread?.quitSafely() }
                  thread = null
                  worker = null

                  panel?.let { runCatching { wm.removeView(it) } }
                  panel = null
                  panelParams = null
                  overlay?.clearAll()
                  overlay?.let { runCatching { wm.removeView(it) } }
                  overlay = null

                  if (stopService) {
                      ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE)
                      stopSelf()
                  }
              }
          }
