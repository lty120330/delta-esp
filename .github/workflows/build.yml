                  root.addView(btn1)
                  root.addView(btn2)
                  root.addView(btn3)

                  root.addView(TextView(this).apply {
                      text = "游戏包名"
                      setTextColor(Color.parseColor("#C7D3DD"))
                      textSize = 12f
                      setPadding(0, dp(16), 0, dp(4))
                  })
                  pkgInput = EditText(this).apply {
                      setText(prefs.gamePkg)
                      hint = "com.tencent.tmgp.dfm"
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.parseColor("#55636F"))
                      textSize = 13f
                      typeface = Typeface.MONOSPACE
                      inputType = InputType.TYPE_CLASS_TEXT
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(10).toFloat()
                          setColor(Color.parseColor("#161C24"))
                          setStroke(dp(1), Color.parseColor("#2A3644"))
                      }
                  }
                  root.addView(
                      pkgInput,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(actionButton("④ 启动游戏", "#233240") { launchGame() })

                  status = TextView(this).apply {
                      setTextColor(Color.parseColor("#7F8C99"))
                      textSize = 11.5f
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(18), 0, 0)
                      text = "初始化…"
                  }
                  root.addView(status)

                  root.addView(TextView(this).apply {
                      text = "使用要点\n" +
                          "1. 首次点②会弹系统录屏框，选“整个屏幕/整个设备”。\n" +
                          "2. 面板可拖动；“采样倍数”改完要重新点②才生效。\n" +
                          "3. 识别高饱和红色描边；框跳动先降灵敏度，再把采样调到 4~6。\n" +
                          "4. 游戏切后台会被系统挂起，回前台自动恢复。"
                      setTextColor(Color.parseColor("#66737F"))
                      textSize = 11.5f
                      setPadding(0, dp(22), 0, 0)
                      setLineSpacing(dp(4).toFloat(), 1f)
                  })

                  return scroll
              }

              private fun actionButton(
                  text: String, bg: String, dark: Boolean = false, onClick: () -> Unit
              ): Button =
                  Button(this).apply {
                      setText(text)
                      setTextColor(
                          if (dark) Color.parseColor("#061014") else Color.parseColor("#D7E3EC")
                      )
                      textSize = 14f
                      background = GradientDrawable().apply {
                          cornerRadius = dp(12).toFloat()
                          setColor(Color.parseColor(bg))
                          if (!dark) setStroke(dp(1), Color.parseColor("#2A3644"))
                      }
                      setOnClickListener { onClick() }
                      val lp = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(48)
                      )
                      lp.topMargin = dp(10)
                      layoutParams = lp
                  }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-esp-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
