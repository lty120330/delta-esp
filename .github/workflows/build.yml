                  try {
                      wm.addView(view, lp)
                  } catch (t: Throwable) {
                      return false
                  }
                  overlay = view

                  val p = PanelView(this, prefs, object : PanelView.Callback {
                      override fun onDrawEnabled(enabled: Boolean) {
                          overlay?.configure(prefs.alpha, enabled)
