                      setTextColor(Color.parseColor("#7F8C99"))
                      textSize = 10.5f
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(6f), 0, 0)
                  }
                  addView(statusView)
              }

              fun setStatus(s: String) {
                  statusView.text = s
              }

              private fun labelRow(label: String, right: View): LinearLayout {
                  val row = LinearLayout(context).apply {
                      orientation = HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(2f), 0, dp(2f))
                  }
                  val tv = TextView(context).apply {
                      text = label
                      setTextColor(Color.parseColor("#C7D3DD"))
                      textSize = 12f
                  }
                  row.addView(
                      tv,
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  row.addView(right)
                  return row
              }

              private fun slider(
                  name: String, min: Int, max: Int, value: Int, onChange: (Int) -> Unit
              ): LinearLayout {
                  val wrap = LinearLayout(context).apply {
                      orientation = VERTICAL
                      setPadding(0, dp(3f), 0, 0)
                  }
                  val tv = TextView(context).apply {
                      text = "$name  $value"
                      setTextColor(Color.parseColor("#C7D3DD"))
                      textSize = 12f
                  }
                  val sb = SeekBar(context).apply {
                      this.max = max - min
                      progress = (value - min).coerceIn(0, max - min)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                              val v = p + min
                              tv.text = "$name  $v"
                              onChange(v)
                          }

                          override fun onStartTrackingTouch(bar: SeekBar?) {}
                          override fun onStopTrackingTouch(bar: SeekBar?) {}
                      })
                  }
                  wrap.addView(tv)
                  wrap.addView(
                      sb,
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(28f))
                  )
                  return wrap
              }

              private fun dp(v: Float) = (v * resources.displayMetrics.density).toInt()
          }
