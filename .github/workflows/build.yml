              }

              private fun attachDrag(v: View) {
                  var rawX0 = 0f
                  var rawY0 = 0f
                  var x0 = 0
                  var y0 = 0
                  v.setOnTouchListener { _, e ->
                      val lp = panelParams
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              rawX0 = e.rawX
                              rawY0 = e.rawY
